name: Jordan Avery
greeting: hello, I'm
intro: I'm an illustrator and designer who makes picture books, posters, and small brand identities. I like work that is warm, a little odd, and made for real people.
portrait: /images/uploads/portrait-placeholder.svg
portrait_alt: An abstract illustrated portrait
about: |-
  I started out drawing maps for tabletop games and never really stopped. These days I split my time between editorial illustration and identity work for independent shops, cafes, and studios.

  Most projects begin in a sketchbook and finish on screen. I care about clear ideas, honest colour, and drawings that still look good small.

  When I'm not at the desk I'm usually walking, printing something on the risograph, or losing at board games.
