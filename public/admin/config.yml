backend:
  name: github
  repo: YOUR_GITHUB_OWNER/YOUR_REPO
  branch: main
  base_url: https://my-site-YOUR_GCP_PROJECT_NUMBER.us-central1.run.app

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Portfolio page"
    files:
      - name: "portfolio"
        label: "Intro, portrait, about, and contact"
        file: "src/content/pages/portfolio.yml"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Greeting above the name", name: "greeting", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Portrait photo", name: "portrait", widget: "image", required: false }
          - { label: "Portrait description (for screen readers)", name: "portrait_alt", widget: "string", required: false }
          - { label: "About me", name: "about", widget: "text", hint: "Leave a blank line between paragraphs." }
          - { label: "Contact email", name: "email", widget: "string" }
  - name: "work"
    label: "Work"
    folder: "src/content/work"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "string" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Order", name: "order", widget: "number", default: 0 }
      - { label: "Body", name: "body", widget: "markdown", required: false }
